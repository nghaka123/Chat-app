<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #ece5dd; margin:0; }
        .header { background: #075E54; color: white; padding: 15px; font-size: 18px; }
        #messages { height: 70vh; overflow-y: auto; padding: 10px; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 7px; max-width: 70%; }
        .me { background: #dcf8c6; margin-left: auto; }
        .other { background: white; }
        .input { display: flex; padding: 10px; background: white; position: fixed; bottom:0; width:100%; }
        .input input { flex:1; padding:10px; border:1px solid #ccc; border-radius:20px; }
        .input button { background:#075E54; color:white; border:none; padding:10px 20px; border-radius:20px; margin-left:5px; }
    </style>
</head>
<body>
    <div class="header">Chat - {{ user }} <a href="/logout" style="float:right; color:white;">Logout</a></div>
    <div id="messages"></div>
    <div class="input">
        <input id="msg" placeholder="Message type...">
        <button onclick="send()">Send</button>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "{{ config.apiKey }}",
    authDomain: "{{ config.authDomain }}",
    databaseURL: "{{ config.databaseURL }}",
    projectId: "{{ config.projectId }}"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  function send(){
    var text = document.getElementById("msg").value;
    if(text){
      db.ref("messages").push({user: "{{ user }}", text: text, time: Date.now()});
      document.getElementById("msg").value = "";
    }
  }

  db.ref("messages").on("child_added", function(snapshot){
    var data = snapshot.val();
    var div = document.createElement("div");
    div.className = "msg " + (data.user == "{{ user }}" ? "me" : "other");
    div.innerHTML = '<b>'+data.user+':</b> '+data.text;
    document.getElementById("messages").appendChild(div);
  });
</script>
</body>
</html>
