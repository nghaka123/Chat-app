<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <style>
        body { font-family: Arial; background: #e5ddd5; margin: 0; }
        .header { background: #075e54; color: white; padding: 15px; }
        .chat-box { height: 80vh; overflow-y: scroll; padding: 10px; }
        .msg { background: white; padding: 8px 12px; border-radius: 8px; margin: 5px 0; max-width: 70%; }
        .me { background: #dcf8c6; margin-left: auto; }
        .input { position: fixed; bottom: 0; width: 100%; display: flex; background: #f0f0f0; padding: 10px; }
        .input input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        .input button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <b>Chat App</b> - Welcome {{ username }}! <a href="/logout" style="color:white; float:right;">Logout</a>
    </div>
    
    <div class="chat-box">
        {% for msg in messages %}
            <div class="msg {% if msg.user == username %}me{% endif %}">
                <b>{{ msg.user }}</b><br>
                {{ msg.text }}
            </div>
        {% endfor %}
    </div>

    <form method="POST" class="input">
        <input type="text" name="message" placeholder="Message type la..." required>
        <button type="submit">Send</button>
    </form>
</body>
</html>
