<!DOCTYPE html>
<html>
<head>
    <title>Chat Room</title>
</head>
<body>
    <h2>Welcome {{ username }}! <a href="/logout">Logout</a></h2>
    
    <div style="border:1px solid black; height:300px; overflow-y:scroll; padding:10px;">
        {% for msg in messages %}
            <p><b>{{ msg.user }}</b>: {{ msg.text }}</p>
        {% endfor %}
    </div>

    <form method="POST">
        <input type="text" name="message" placeholder="Message type la" required>
        <button type="submit">Send</button>
    </form>
</body>
</html>
