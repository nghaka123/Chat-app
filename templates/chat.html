<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <style>
    body {
        margin: 0;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        height: 100vh; /* Screen pum huam */
    }

    .header {
        background: #006d5b;
        color: white;
        padding: 12px;
        font-weight: bold;
    }

    .chat-box {
        flex: 1; /* A ruangam zawng zawng a luah */
        overflow-y: auto; /* A sang a pelh chuan a scroll thei */
        padding: 10px;
        background: #ece5dd;
    }

    .message {
        background: #d9fdd3;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        max-width: 70%;
        margin-left: auto; /* Dinglam ah a awm */
        word-wrap: break-word;
    }

    .send-box {
        display: flex;
        padding: 8px;
        background: white;
        border-top: 1px solid #ddd;
    }

    .send-box input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 20px;
        outline: none;
    }

    .send-box button {
        margin-left: 8px;
        padding: 10px 16px;
        border: none;
        background: #006d5b;
        color: white;
        border-radius: 20px;
    }
    </style>
</head>
<body>
        <div class="header">
        Chat - {{ session['user'] }}
    </div>

    <div class="chat-box" id="chat">
        {% for msg in messages %}
            <div class="message">
                <b>{{ msg.user }}</b>: {{ msg.text }}
            </div>
        {% endfor %}
    </div>

    <form class="send-box" method="POST">
        <input type="text" name="message" placeholder="Message type..." autocomplete="off">
        <button type="submit">Send</button>
    </form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {{ config|tojson }};
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "messages");

  onChildAdded(messagesRef, (data) => {
    const msg = data.val();
    const div = document.createElement("div");
    div.className = "message"; // <-- heihi a pawimawh
    div.innerText = msg.user + ": " + msg.text;
    document.getElementById("messages").appendChild(div);
  });

  function sendMsg() {
    const text = document.getElementById("msg").value;
    if(text.trim() !== ""){
        push(messagesRef, { user: "{{ user }}", text: text });
        document.getElementById("msg").value = "";
    }
  }
  window.sendMsg = sendMsg;
</script>
</body>
</html>
