<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <style>
        body { 
            background: #ece5dd; 
            font-family: Arial; 
            margin: 0;
            padding: 0;
        }
        .header {
            background: #075e54;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
        }
        .header a { color: white; text-decoration: none; margin-left: 10px;}
        #messages { 
            padding: 10px; 
            padding-top: 60px;
            padding-bottom: 70px;
            height: calc(100vh - 130px);
            overflow-y: scroll;
        }
        .message { 
            background: #dcf8c6; 
            border-radius: 8px; 
            padding: 8px 12px; 
            margin: 5px 0; 
            max-width: 70%; 
            float: right;
            clear: both;
        }
        .message.other {
            background: white;
            float: left;
        }
        .message small {
            display: block;
            font-size: 10px;
            color: #555;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }
        #msg { 
            flex: 1; 
            padding: 10px; 
            border-radius: 20px; 
            border: 1px solid #ccc;
        }
        button { 
            padding: 10px 20px; 
            margin-left: 5px;
            border-radius: 20px;
            border: none;
            background: #075e54;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Chat - {{ room }}</span>
        <div>
            <a href="/users">Mi be tur</a>
            <a href="/setting">⚙️</a>
        </div>
    </div>
    
    <div id="messages">
        {% for msg in messages %}
        <div class="message {% if msg.sender != me %}other{% endif %}">
            <b>{{ msg.sender }}</b>
            <p>{{ msg.message }}</p>
            <small>Time</small>
        </div>
        {% endfor %}
    </div>
    
    <form method="POST" class="input-area">
        <input id="msg" name="message" placeholder="Message type..." required>
        <button type="submit">Send</button>
    </form>

<script>
    // Page load in hnuai ber ah scroll
    var objDiv = document.getElementById("messages");
    objDiv.scrollTop = objDiv.scrollHeight;
</script>
</body>
</html>
