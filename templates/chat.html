<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>
    <style>
        body { 
            background: #ece5dd; 
            font-family: Arial; 
            margin: 0;
            padding: 0;
        }
        .header {
            background: #075e54;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
        }
        .header a { color: white; text-decoration: none; }
        #messages { 
            padding: 10px; 
            height: 75vh; 
            overflow-y: scroll;
        }
        .message { 
            background: #dcf8c6; 
            border-radius: 8px; 
            padding: 8px 12px; 
            margin: 5px 0; 
            max-width: 70%; 
            float: right;
            clear: both;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            position: fixed;
            bottom: 0;
            width: 40%;
        }
        #msg { 
            flex: 1; 
            padding: 10px; 
            border-radius: 20px; 
            border: 1px solid #ccc;
        }
        button { 
            padding: 10px 20px; 
            margin-left: 5px;
            border-radius: 20px;
            border: none;
            background: #075e54;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Chat - {{ user }}</span>
        <a href="/setting" class="text-white">⚙️</a>
    </div>
    
    <div id="messages"></div>
    
    <div class="input-area">
        <input id="msg" placeholder="Message type...">
        <button onclick="sendMsg()">Send</button>
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {{ config|tojson }};
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "messages");

  onChildAdded(messagesRef, (data) => {
    const msg = data.val();
    const div = document.createElement("div");
    div.className = "message"; // <-- heihi a pawimawh
    div.innerText = msg.user + ": " + msg.text;
    document.getElementById("messages").appendChild(div);
  });

  function sendMsg() {
    const text = document.getElementById("msg").value;
    if(text.trim() !== ""){
        push(messagesRef, { user: "{{ user }}", text: text });
        document.getElementById("msg").value = "";
    }
  }
  window.sendMsg = sendMsg;
</script>
</body>
</html>
