<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #005f5f; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Password theihnghilh</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="I email dah rawh" required>
            <button type="submit">Reset Link thawn</button>
        </form>
        <p><a href="/">Login lam ah kir</a></p>
    </div>
</body>
</html>
