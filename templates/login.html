<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat-app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F1E8] flex items-center justify-center min-h-screen p-4">
  
  <!-- Card -->
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
    
    <!-- Title -->
    <h1 class="text-4xl font-bold text-center mb-8 text-[#00695C]">Chat-app</h1>
    
    <!-- Form -->
    <form>
      <!-- Email -->
      <input 
        type="email" 
        placeholder="Email" 
        class="w-full p-4 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-[#00695C] text-base"
        required
      >
      
      <!-- Password -->
      <input 
        type="password" 
        placeholder="Password" 
        class="w-full p-4 border-gray-300 rounded-xl mb-2 focus:outline-none focus:ring-2 focus:ring-[#00695C] text-base"
        required
      >
      
      <!-- Forgot Password -->
      <div class="text-right mb-6">
        <a href="/forgot-password" class="text-sm text-[#00695C] hover:underline font-medium">Forgot Password?</a>
      </div>
      
      <!-- Login Button -->
      <button 
        type="submit"
        class="w-full bg-[#00695C] text-white p-4 rounded-xl font-semibold text-lg hover:bg-[#004D40] transition"
      >
        Login
      </button>
    </form>
    
    <!-- Signup Link -->
    <p class="text-center mt-6 text-base">
      Account i nei lo em? 
      <a href="/signup" class="text-[#00695C] font-bold hover:underline">
