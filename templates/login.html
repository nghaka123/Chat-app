<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat-app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F1E8] flex items-center justify-center min-h-screen p-2">
  
  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-xl">
    
    <h1 class="text-3xl font-bold text-center mb-6 text-[#00695C]">Chat-app</h1>
    
    <form action="#" method="POST">
      
      <input 
        type="email" 
        name="email"
        placeholder="Email" 
        required
        class="w-full p-3 border-gray-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <input 
        type="password" 
        name="password"
        placeholder="Password" 
        required
        class="w-full p-3 border-gray-300 rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <!-- FORGOT LINK DIK -->
      <div class="text-right mb-4">
        <a href="/forgot" class="text-sm text-[#00695C] font-medium hover:underline">Forgot Password?</a>
      </div>
      
      <button type="submit" class="w-full bg-[#00695C] text-white p-3 rounded-lg font-semibold hover:bg-[#004D40]">
        Login
      </button>
      
    </form>
    
    <!-- SIGNUP LINK DIK -->
    <p class="text-center mt-4 text-sm">Account i nei lo em? <a href="/signup" class="text-[#00695C] font-semibold hover:underline">Signup rawh</a></p>
  </div>

</body>
</html>
