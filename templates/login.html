<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat-app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- html leh body ah h-full dah -->
<body class="bg-white h-full p-0 m-0">
  
  <!-- min-h-screen + justify-center = chung hnuai ah a inhlawm vek -->
  <div class="bg-white w-full min-h-screen flex flex-col justify-center p-6">
    
    <h1 class="text-4xl font-bold text-center mb-10 text-[#00695C]">Chat-app</h1>
    
    <form action="#" method="POST" class="w-full space-y-4">
      
      <input 
        type="email" 
        name="email"
        placeholder="Email" 
        required
        class="w-full p-4 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <input 
        type="password" 
        name="password"
        placeholder="Password" 
        required
        class="w-full p-4 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <div class="text-right">
        <a href="/forgot" class="text-sm text-[#00695C] font-medium hover:underline">Forgot Password?</a>
      </div>
      
      <button type="submit" class="w-full bg-[#00695C] text-white p-4 rounded-xl font-semibold text-lg hover:bg-[#004D40] mt-2">
        Login
      </button>
      
    </form>
    
    <p class="text-center mt-6 text-sm">Account i nei lo em? <a href="/signup" class="text-[#00695C] font-semibold hover:underline">Signup rawh</a></p>
  </div>

</body>
</html>
