<!DOCTYPE html>
<html>
<head><title>Login</title>
<style>
body{background:#ece5dd;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:10px;width:300px}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:10px;background:#075e54;color:white;border:none;border-radius:5px}
.error{color:red;font-size:14px}
a{text-decoration:none;color:#075e54;font-size:14px}
</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    
    <h1 class="text-3xl font-bold text-center mb-6">Chat-app</h1>
    
    <form>
      <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg mb-4">
      <input type="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4">
      <button class="w-full bg-blue-500 text-white p-3 rounded-lg font-semibold">Login</button>
    </form>
    
    <p class="text-center mt-4">Account i nei lo em? <a href="/signup" class="text-blue-500">Signup rawh</a></p>
  </div>
</body>
</html>
