<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat-app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>


  <body class="bg-[#F5F1E8] flex items-center justify-center min-h-screen p-0 m-0">
  
  <!-- max-w-md paihbo la w-full h-full dah -->
  <div class="bg-white w-full h-full flex-col justify-center p-6 shadow-none">
    
    <h1 class="text-3xl font-bold text-center mb-8 text-[#00695C]">Chat-app</h1>
    
    <form action="#" method="POST" class="w-full">
      
      <input 
        type="email" 
        name="email"
        placeholder="Email" 
        required
        class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <input 
        type="password" 
        name="password"
        placeholder="Password" 
        required
        class="w-full p-3 border-gray-300 rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-[#00695C]"
      >
      
      <div class="text-right mb-6">
        <a href="/forgot" class="text-sm text-[#00695C] font-medium hover:underline">Forgot Password?</a>
      </div>
      
      <button type="submit" class="w-full bg-[#00695C] text-white p-3 rounded-lg font-semibold hover:bg-[#004D40]">
        Login
      </button>
      
    </form>
    
    <p class="text-center mt-6 text-sm">Account i nei lo em? <a href="/signup" class="text-[#00695C] font-semibold hover:underline">Signup rawh</a></p>
  </div>

  </body>
</html>
