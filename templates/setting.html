<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Chat-app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F1E8] min-h-screen">

  <!-- Header -->
  <div class="bg-[#00695C] text-white p-4 flex items-center">
    <a href="/chat" class="mr-4">←</a>
    <h1 class="text-xl font-semibold">Settings</h1>
  </div>

  <!-- Profile -->
  <div class="bg-white p-6 flex items-center gap-4">
    <img src="https://i.pravatar.cc/80" class="w-16 h-16 rounded-full">
    <div>
      <p class="font-bold text-lg">I Hming</p>
      <p class="text-gray-500 text-sm">i@email.com</p>
    </div>
  </div>

  <!-- Menu list -->
  <div class="mt-2 bg-white">

    <a href="/profile" class="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50">
      <span class="mr-3">👤</span> Profile
    </a>

    <a href="/theme" class="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50">
      <span class="mr-3">🌙</span> Theme: Light
    </a>

    <a href="/notification" class="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50">
      <span class="mr-3">🔔</span> Notifications
    </a>

    <a href="/privacy" class="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50">
      <span class="mr-3">🔒</span> Privacy
    </a>

    <!-- Logout -->
    <a href="/logout" class="flex items-center p-4 text-red-600 hover:bg-red-50">
      <span class="mr-3">🚪</span> Logout
    </a>

  </div>

</body>
</html>
