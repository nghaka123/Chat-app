<!DOCTYPE html>
<html>
<head><title>Signup</title>
<style>
body{background:#ece5dd;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:10px;width:300px}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:10px;background:#075e54;color:white;border:none;border-radius:5px}
.error{color:red;font-size:14px}
a{text-decoration:none;color:#075e54;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Signup</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<button>Signup</button>
</form>
<a href="/">Login na lam ah kir</a>
</div>
</body>
</html>
