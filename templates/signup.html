<!DOCTYPE html>
<html>
<head><title>Signup</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:sans-serif;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px #ccc;width:300px}
input{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px}
button{width:100%;padding:10px;background:#007bff;color:white;border:none;border-radius:5px;cursor:pointer}</style></head>
<body><div class="box"><h2>Signup</h2>
<form method="POST">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Signup</button></form>
<p>Account i nei tawh chuan <a href="/login">Login</a></p></div></body></html>
